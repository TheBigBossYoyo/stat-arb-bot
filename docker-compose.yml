services:
  bot:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/stat_arb.db
    volumes:
      - statarb-data:/data
      - ./reports:/app/reports
      - ./logs:/app/logs

  dashboard:
    build: .
    command: ["statarb", "dashboard", "--port", "8000"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/stat_arb.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - statarb-data:/data

  # optional production database — switch DATABASE_URL to use it
  # postgres:
  #   image: postgres:16
  #   environment:
  #     POSTGRES_DB: statarb
  #     POSTGRES_USER: statarb
  #     POSTGRES_PASSWORD: change-me
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data

volumes:
  statarb-data:
  # pg-data:

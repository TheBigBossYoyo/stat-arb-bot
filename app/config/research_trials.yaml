# Historical research-trial manifest (Phase 2 — true deflated Sharpe).
#
# The experiment tracker only counts runs made AFTER it was added, so the
# deflated Sharpe sees ~1 trial while the research program actually evaluated
# ~50 configurations to select the flagship (audit W-02; FINAL_RESEARCH_REPORT
# blocker #8). This manifest back-fills those historical trials from the
# documented record so the deflation corrects for the REAL search.
#
# Every entry cites its source in docs/. Sharpes are the annualized figures the
# docs report; `sharpe: null` marks a return-only trial (still COUNTED toward
# the trial total, just not used for the Sharpe-dispersion estimate). Numbers
# pre-date the 2026-06-13 audit re-statement (the flagship's restated full-window
# Sharpe is ~1.02) — that is fine: these are the *trials that were searched*, and
# their dispersion is what inflates the winner.
#
# `group` is the selection family: the set of configs evaluated for the SAME
# decision. The flagship is deflated against its whole group, not its exact-config
# family of one.

groups:
  equity_daily_book_selection:
    description: >-
      Every config evaluated to choose the daily US-equity book (sleeve choice,
      allocator, ML variants, robustness) on us_stocks_50/100, 1d, 5 bps.
    universe: us_stocks_50
    interval: 1d
  crypto_15m_search:
    description: Crypto 15m sweeps (different cost regime; separate decision).
    universe: crypto_top_10
    interval: 15m

trials:
  # --- standalone equity sleeves (us_stocks_50, 1d) — strategy_research.md §5,7 ---
  - {id: eq_pca_standalone, group: equity_daily_book_selection, strategy: pca_stat_arb, sharpe: 0.27, return_pct: 7.7, source: "strategy_research.md §5"}
  - {id: eq_tsmom_standalone, group: equity_daily_book_selection, strategy: tsmom, sharpe: 0.88, return_pct: 28.8, source: "strategy_research.md §5"}
  - {id: eq_xsmom_standalone, group: equity_daily_book_selection, strategy: xsec_momentum, sharpe: 1.11, return_pct: 92.9, source: "strategy_research.md §5"}
  - {id: eq_ml_legacy, group: equity_daily_book_selection, strategy: ml_alpha, sharpe: 0.84, return_pct: 28.5, source: "strategy_research.md §7b (variant A)"}
  - {id: eq_ml_orthogonal, group: equity_daily_book_selection, strategy: ml_alpha, sharpe: 0.05, return_pct: 0.2, source: "strategy_research.md §7b (variant B)"}
  - {id: eq_ml_momneutral, group: equity_daily_book_selection, strategy: ml_alpha, sharpe: 0.89, return_pct: 26.7, source: "strategy_research.md §7b (variant C)"}
  - {id: eq_ml_both, group: equity_daily_book_selection, strategy: ml_alpha, sharpe: 0.30, return_pct: 7.8, source: "strategy_research.md §7b (variant D)"}
  - {id: eq_pca_flat, group: equity_daily_book_selection, strategy: pca_stat_arb, sharpe: -0.18, return_pct: -6.8, source: "strategy_research.md §5"}
